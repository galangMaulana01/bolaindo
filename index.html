<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    html { scroll-behavior: smooth; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>

<body class="bg-[#0b0c0d] text-white min-h-screen relative pb-10">

  <header class="sticky top-0 z-40 bg-[#0b0c0d]/95 backdrop-blur-md border-b border-gray-900 pt-3 pb-2">
    <div class="relative max-w-2xl mx-auto flex items-center">
      <div id="date-slider" class="flex items-center gap-2 overflow-x-auto no-scrollbar px-2 w-full pb-1 scroll-smooth"></div>
      <div class="absolute right-0 top-0 bottom-0 flex items-center pr-4 pl-8 bg-gradient-to-l from-[#0b0c0d] via-[#0b0c0d] to-transparent">
        <button onclick="toggleCalendar()" class="bg-[#1c1d20] hover:bg-gray-800 p-2.5 rounded-full border border-gray-800 transition-colors active:scale-95">
          <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div id="calendar-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center px-4 bg-black/60 backdrop-blur-sm transition-opacity">
    <div class="bg-[#18191b] border border-gray-800 w-full max-w-md rounded-2xl shadow-2xl overflow-hidden p-4">
      <div class="flex items-center justify-between mb-4 px-2">
        <h3 id="calendar-month-year" class="text-[16px] font-bold text-white">Jun 2026</h3>
        <div class="flex gap-4">
          <button onclick="changeMonth(-1)" class="p-1 text-gray-400 hover:text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg></button>
          <button onclick="changeMonth(1)" class="p-1 text-gray-400 hover:text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg></button>
        </div>
      </div>
      <div class="grid grid-cols-7 text-center text-xs font-semibold text-gray-500 mb-2">
        <div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
      </div>
      <div id="calendar-grid" class="grid grid-cols-7 text-center gap-y-2 text-sm font-medium"></div>
      <div class="mt-6 flex justify-end">
         <button onclick="toggleCalendar()" class="px-5 py-2 bg-gray-800 hover:bg-gray-700 rounded-lg text-sm font-bold text-white">Tutup</button>
      </div>
    </div>
  </div>

  <main class="max-w-2xl mx-auto p-4 mt-2">
    <div id="loading-state" class="text-center py-12">
      <div class="w-8 h-8 border-4 border-gray-700 border-t-yellow-400 rounded-full animate-spin mx-auto mb-4"></div>
      <p class="text-sm text-gray-400">Memuat jadwal pertandingan...</p>
    </div>

    <div id="matches" class="space-y-6 hidden"></div>
    
    <div id="empty-state" class="hidden text-center py-16 text-gray-500">
      <div class="text-4xl mb-3">⚽</div>
      <p>Tidak ada pertandingan di tanggal ini.</p>
    </div>
  </main>

<script>
const apiKey = "20cbd64e90926ce0eefd4b1e9127059d35058c253fb15a1a6b9b66efe131b5c0";
const data5 = [153, 168, 55, 653, 356];

let currentDate = new Date(); 
let selectedDate = new Date(); 
let autoRefreshInterval = null;

const formatForApi = (date) => date.toISOString().split("T")[0]; 
const getShortDay = (date) => date.toLocaleDateString('en-US', { weekday: 'short' }); 
const getShortMonth = (date) => date.toLocaleDateString('en-US', { month: 'short' }); 
const isSameDate = (d1, d2) => d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth() && d1.getDate() === d2.getDate();

function renderDateSlider() {
  const slider = document.getElementById("date-slider");
  slider.innerHTML = "";
  const today = new Date();
  
  for (let i = -15; i <= 15; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() + i);
    
    const isToday = isSameDate(d, today);
    const isSelected = isSameDate(d, selectedDate);
    const dayName = isToday ? "Today" : getShortDay(d);
    const dateText = `${d.getDate()} ${getShortMonth(d)}`;

    let bgClass = isSelected ? "bg-[#2a2b2e]" : "bg-transparent hover:bg-white/5";
    let textDayClass = isSelected ? "text-white" : "text-gray-400";
    let textDateClass = isSelected ? "text-gray-300" : "text-gray-500";
    
    const btnHtml = `
      <button onclick="selectDate('${formatForApi(d)}')" class="flex flex-col items-center justify-center min-w-[70px] px-2 py-1.5 rounded-xl cursor-pointer transition-colors ${bgClass}">
        <span class="text-[13px] font-bold ${textDayClass}">${dayName}</span>
        <span class="text-[11px] font-medium ${textDateClass} mt-0.5">${dateText}</span>
      </button>
    `;
    slider.insertAdjacentHTML('beforeend', btnHtml);
  }

  setTimeout(() => {
    const selectedEl = slider.querySelector('.bg-\\[\\#2a2b2e\\]');
    if(selectedEl) selectedEl.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  }, 100);
}

function toggleCalendar() {
  const modal = document.getElementById("calendar-modal");
  modal.classList.toggle("hidden");
  if (!modal.classList.contains("hidden")) {
    currentDate = new Date(selectedDate); 
    renderCalendarGrid();
  }
}

function changeMonth(step) {
  currentDate.setMonth(currentDate.getMonth() + step);
  renderCalendarGrid();
}

function renderCalendarGrid() {
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();
  document.getElementById("calendar-month-year").innerText = currentDate.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
  
  const firstDayIndex = new Date(year, month, 1).getDay(); 
  const startOffset = firstDayIndex === 0 ? 6 : firstDayIndex - 1; 
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const grid = document.getElementById("calendar-grid");
  grid.innerHTML = "";

  for (let i = 0; i < startOffset; i++) grid.innerHTML += `<div></div>`;

  for (let i = 1; i <= daysInMonth; i++) {
    const iterDate = new Date(year, month, i);
    const isSelected = isSameDate(iterDate, selectedDate);
    let btnClass = isSelected ? "text-yellow-400 border border-yellow-400/50 bg-yellow-400/10 rounded-lg" : "text-gray-300 hover:bg-gray-800 rounded-lg";
    grid.innerHTML += `
      <button onclick="selectDate('${formatForApi(iterDate)}'); toggleCalendar();" class="p-2 w-10 h-10 mx-auto flex items-center justify-center transition-colors ${btnClass}">
        ${i}
      </button>
    `;
  }
}

function selectDate(dateString) {
  selectedDate = new Date(dateString);
  renderDateSlider(); 
  loadData(formatForApi(selectedDate), false); 
  
  // Setup auto-refresh khusus jika buka tanggal HARI INI
  if (autoRefreshInterval) clearInterval(autoRefreshInterval);
  if (isSameDate(selectedDate, new Date())) {
    autoRefreshInterval = setInterval(() => {
      loadData(formatForApi(selectedDate), true); // true = silent refresh
    }, 60000);
  }
}

async function getSelectedLeagues() {
  const countryIds = [44, 3, 18, 114, 133];
  let allLeagues = [];
  for (const countryId of countryIds) {
    try {
      const response = await fetch(`https://apiv3.apifootball.com/?action=get_leagues&country_id=${countryId}&APIkey=${apiKey}`);
      const leagues = await response.json();
      if (Array.isArray(leagues)) allLeagues.push(...leagues);
    } catch (e) { console.error("Error fetching leagues:", e); }
  }
  return allLeagues.filter(league => data5.includes(parseInt(league.league_id))).map(league => ({
    id: parseInt(league.league_id), name: league.league_name, logo: league.league_logo, country: league.country_name
  }));
}

// AMBIL RANGE H-1 SAMPAI H+1 UNTUK MENGHINDARI BUG ZONA WAKTU
async function getMatches(leagueId, targetDate) {
  try {
    const target = new Date(targetDate);
    
    const dPrev = new Date(target); dPrev.setDate(dPrev.getDate() - 1);
    const dNext = new Date(target); dNext.setDate(dNext.getDate() + 1);
    
    const prevDate = dPrev.toISOString().split("T")[0];
    const nextDate = dNext.toISOString().split("T")[0];

    const response = await fetch(`https://apiv3.apifootball.com/?action=get_events&from=${prevDate}&to=${nextDate}&league_id=${leagueId}&timezone=Asia/Jakarta&APIkey=${apiKey}`);
    const data = await response.json();
    
    if (!data || !Array.isArray(data) || data.error) return [];
    
    // Pastikan hanya match di tanggal WIB yang dipilih yang masuk
    return data.filter(match => match.match_date === targetDate);
  } catch (e) {
    return [];
  }
}

async function loadData(targetDate, isSilent = false) {
  const matchesContainer = document.getElementById("matches");
  const loadingState = document.getElementById("loading-state");
  const emptyState = document.getElementById("empty-state");
  
  if (!isSilent) {
    matchesContainer.classList.add("hidden");
    emptyState.classList.add("hidden");
    loadingState.classList.remove("hidden");
  }

  const selectedLeagues = await getSelectedLeagues();
  const matchPromises = selectedLeagues.map(async (league) => {
    const matches = await getMatches(league.id, targetDate); 
    return { league, matches: matches };
  });

  const allLeagueMatches = await Promise.all(matchPromises);
  
  matchesContainer.innerHTML = "";
  let totalMatchesFound = 0;

  allLeagueMatches.forEach(({ league, matches }) => {
    if (matches.length === 0) return;
    totalMatchesFound += matches.length;

    const leagueSection = document.createElement("div");
    leagueSection.className = "space-y-2 mb-6 scroll-mt-4";
    
    let htmlContent = `
      <div class="flex items-center justify-between py-3 px-2">
        <div class="flex items-center gap-3">
          <img src="${league.logo || 'https://placehold.co/40'}" class="w-9 h-9 object-contain rounded-full bg-[#18191b] p-1 border border-gray-800" alt="" />
          <div>
            <h2 class="text-[15px] font-bold text-white leading-tight">${league.name}</h2>
            <p class="text-[12px] text-gray-400 font-normal mt-0.5">${league.country || 'International'}</p>
          </div>
        </div>
      </div>
      <div class="space-y-2">
    `;

    htmlContent += matches.map(match => {
      const statusRaw = (match.match_status || "").trim();
      const statusLower = statusRaw.toLowerCase();
      const homeScore = match.match_hometeam_score ?? "";
      const awayScore = match.match_awayteam_score ?? "";
      
      // LOGIKA STATUS YANG LEBIH KUAT (Babat Bug Full-Time telat)
      const isFinished = ["finished", "ft", "aet", "ap", "pen.", "after pen."].includes(statusLower) || statusLower.includes("finish") || statusLower === "ft";
      const isCancelled = ["cancelled", "postponed", "canc", "postp"].includes(statusLower);
      const isLive = match.match_live === "1" || 
                     ["1h", "2h", "ht", "et", "p", "pen", "break"].includes(statusLower) || 
                     (statusLower !== "" && !isNaN(statusLower) && !isFinished);

      let centerDisplay = "";

      if (isFinished) {
        centerDisplay = `
          <div class="text-center shrink-0 min-w-[75px]">
            <div class="text-[15px] font-bold tracking-wider text-gray-400 leading-none">${homeScore} - ${awayScore}</div>
            <div class="text-[10px] text-gray-500 font-medium mt-1">Full-Time</div>
          </div>`;
      } 
      else if (isLive) {
        centerDisplay = `
          <div class="text-center shrink-0 min-w-[75px]">
            <div class="text-lg font-extrabold tracking-widest text-yellow-400 animate-pulse leading-none">${homeScore || '0'} - ${awayScore || '0'}</div>
            <div class="text-[11px] text-red-500 font-bold mt-1 flex items-center justify-center gap-1">
              <span class="inline-block w-1 h-1 bg-red-500 rounded-full animate-ping"></span>
              <span>${statusRaw}${isNaN(statusRaw) ? '' : "'"}</span>
            </div>
          </div>`;
      } 
      else if (isCancelled) {
        centerDisplay = `
          <div class="text-center shrink-0 min-w-[75px]">
            <div class="text-[11px] font-bold text-red-500 uppercase tracking-wide leading-none">${statusRaw}</div>
          </div>`;
      } 
      else {
        centerDisplay = `
          <div class="text-center shrink-0 min-w-[75px]">
            <div class="text-sm font-bold text-white leading-none">${match.match_time || '00:00'}</div>
            <div class="text-[10px] text-gray-500 font-normal mt-1">Belum Mulai</div>
          </div>`;
      }

      return `
        <div onclick="window.location.href='match-detail.html?id=${match.match_id}&league_id=${match.league_id}'" class="flex items-center justify-between p-4.5 bg-gradient-to-r from-red-950/40 to-[#121315] border border-gray-800/60 rounded-xl transition-all cursor-pointer active:scale-[0.98]">
          <div class="flex items-center gap-3 w-[40%] justify-start">
            <img src="${match.team_home_badge || 'https://placehold.co/24'}" class="w-6 h-6 object-contain rounded-full bg-gray-900/50 p-0.5 shrink-0" onerror="this.src='🛡️'">
            <span class="text-[14px] font-bold text-gray-200 truncate text-left">${match.match_hometeam_name}</span>
          </div>
          <div class="w-[20%] flex justify-center">${centerDisplay}</div>
          <div class="flex items-center gap-3 w-[40%] justify-end text-right">
            <span class="text-[14px] font-bold text-gray-200 truncate text-right">${match.match_awayteam_name}</span>
            <img src="${match.team_away_badge || 'https://placehold.co/24'}" class="w-6 h-6 object-contain rounded-full bg-gray-900/50 p-0.5 shrink-0" onerror="this.src='⚽'">
          </div>
        </div>
      `;
    }).join("") + `</div>`;

    leagueSection.innerHTML = htmlContent;
    matchesContainer.appendChild(leagueSection);
  });

  if (!isSilent) loadingState.classList.add("hidden");
  
  if (totalMatchesFound > 0) {
    matchesContainer.classList.remove("hidden");
    if (!isSilent) emptyState.classList.add("hidden");
  } else {
    if (!isSilent) {
      matchesContainer.classList.add("hidden");
      emptyState.classList.remove("hidden");
    }
  }
}

// Inisialisasi awal
renderDateSlider();
selectDate(formatForApi(selectedDate)); 
</script>

</body>
</html>
