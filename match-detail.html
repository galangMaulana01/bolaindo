<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #222;
      border-radius: 10px;
    }
  </style>
</head>

<body class="bg-[#0b0c0d] text-[#e3e4e6] min-h-screen">

  <header class="bg-gradient-to-b from-red-950/50 via-[#111113] to-[#0b0c0d] pt-6 pb-4 border-b border-gray-900">
    <div class="max-w-2xl mx-auto px-4">
      
      <div class="flex items-center justify-between mb-4">
        <button onclick="window.history.back()" class="p-2 hover:bg-white/5 rounded-full transition active:scale-95">
          <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path>
          </svg>
        </button>
        <span class="text-xs font-semibold tracking-wider text-gray-400 uppercase" id="league-name-header">Match Detail</span>
        <div class="w-10"></div>
      </div>

      <div id="scoreboard-loading" class="text-center py-6 text-sm text-gray-500 animate-pulse">Memuat data pertandingan...</div>
      
      <div id="scoreboard-container" class="hidden flex items-center justify-between px-4 py-4">
        <div class="flex flex-col items-center text-center w-[35%]">
          <img id="home-logo" src="" class="w-16 h-16 object-contain mb-2" alt="">
          <span id="home-name" class="text-[15px] font-bold text-white line-clamp-2"></span>
        </div>

        <div class="text-center w-[30%]">
          <div id="match-score" class="text-3xl font-extrabold tracking-widest text-white">0 - 0</div>
          <div id="match-status" class="text-xs font-semibold text-gray-400 bg-black/40 px-2.5 py-1 rounded-full border border-gray-800/40 inline-block mt-2">Full-Time</div>
        </div>

        <div class="flex flex-col items-center text-center w-[35%]">
          <img id="away-logo" src="" class="w-16 h-16 object-contain mb-2" alt="">
          <span id="away-name" class="text-[15px] font-bold text-white line-clamp-2"></span>
        </div>
      </div>

      <div id="scorers-summary" class="hidden grid grid-cols-2 gap-4 mt-2 px-2 text-[12px] text-gray-400 border-t border-gray-900/50 pt-3">
        <div id="home-scorers-list" class="space-y-1 text-left"></div>
        <div id="away-scorers-list" class="space-y-1 text-right"></div>
      </div>

    </div>
  </header>

  <nav class="sticky top-0 bg-[#0b0c0d]/90 backdrop-blur-md border-b border-gray-900 z-50">
    <div class="max-w-2xl mx-auto px-4 py-3 flex gap-2 overflow-x-auto">
      <button onclick="switchTab('overview')" id="btn-overview" class="tab-btn px-4 py-1.5 rounded-full text-xs font-bold bg-yellow-400 text-black transition-all">Overview</button>
      <button onclick="switchTab('events')" id="btn-events" class="tab-btn px-4 py-1.5 rounded-full text-xs font-bold bg-[#1c1d20] text-gray-400 hover:text-white transition-all">Events</button>
      <button onclick="switchTab('stats')" id="btn-stats" class="tab-btn px-4 py-1.5 rounded-full text-xs font-bold bg-[#1c1d20] text-gray-400 hover:text-white transition-all">Stats</button>
      <button onclick="switchTab('lineup')" id="btn-lineup" class="tab-btn px-4 py-1.5 rounded-full text-xs font-bold bg-[#1c1d20] text-gray-400 hover:text-white transition-all">Line-up</button>
    </div>
  </nav>

  <main class="max-w-2xl mx-auto p-4 space-y-4">

    <section id="tab-overview" class="tab-content space-y-4">
      <div class="bg-[#141414] border border-gray-900 rounded-xl p-4">
        <h3 class="text-sm font-bold text-gray-400 mb-3 uppercase tracking-wider text-[11px]">Match Info</h3>
        <div class="space-y-3 text-sm">
          <div class="flex items-center gap-3 text-gray-300">
            <span class="text-base shrink-0">🏆</span>
            <div>
              <p id="info-league" class="font-semibold text-white"></p>
              <p id="info-stage" class="text-xs text-gray-500"></p>
            </div>
          </div>
          <div class="flex items-center gap-3 text-gray-300 border-t border-gray-900 pt-3">
            <span class="text-base shrink-0">📅</span>
            <div>
              <p id="info-date" class="font-semibold text-white"></p>
              <p id="info-time" class="text-xs text-gray-500"></p>
            </div>
          </div>
        </div>
      </div>

      <div id="h2h-container" class="space-y-3">
        <div class="bg-[#141414] border border-gray-900 rounded-xl p-4 text-center text-xs text-gray-500 animate-pulse">
          Memuat data Head-to-Head...
        </div>
      </div>
    </section>

    <section id="tab-events" class="tab-content hidden space-y-4">
      <div class="bg-[#141414] border border-gray-900 rounded-xl p-4">
        <h3 class="text-sm font-bold text-gray-400 mb-4 uppercase tracking-wider text-[11px]">Match Timeline</h3>
        <div class="relative border-l-2 border-gray-800 ml-4 pl-6 space-y-6" id="timeline-container"></div>
      </div>
    </section>

    <section id="tab-stats" class="tab-content hidden space-y-5">
      <div id="stats-container" class="space-y-6">
        <div class="bg-[#141414] border border-gray-900 rounded-xl p-6 text-center text-xs text-gray-500 animate-pulse">
          Memuat data statistik pertandingan...
        </div>
      </div>
    </section>

    <section id="tab-lineup" class="tab-content hidden space-y-4">
      <div class="flex justify-between items-center bg-[#141414] border border-gray-900 rounded-xl p-4">
        <div>
          <h4 class="text-xs font-bold text-gray-500 uppercase">Pelatih Utama</h4>
          <div class="grid grid-cols-2 gap-x-6 gap-y-2 text-sm">
            <div id="home-coach" class="space-y-2 border-r border-gray-900/50 pr-3"></div>
            <div id="away-coach" class="space-y-2 pl-3"></div>
          </div>
        </div>
      </div>

      <div class="bg-[#141414] border border-gray-900 rounded-xl p-4">
        <h3 class="text-xs font-bold text-gray-400 mb-4 uppercase tracking-wider text-[11px]">Starting Lineups</h3>
        <div class="grid grid-cols-2 gap-x-6 gap-y-2 text-sm">
          <div id="home-starting-players" class="space-y-2 border-r border-gray-900/50 pr-3"></div>
          <div id="away-starting-players" class="space-y-2 pl-3"></div>
        </div>
      </div>

      <div class="bg-[#141414] border border-gray-900 rounded-xl p-4">
        <h3 class="text-xs font-bold text-gray-400 mb-4 uppercase tracking-wider text-[11px]">Substitutes (Cadangan)</h3>
        <div class="grid grid-cols-2 gap-x-6 gap-y-2 text-sm">
          <div id="home-substitute-players" class="space-y-2 border-r border-gray-900/50 pr-3"></div>
          <div id="away-substitute-players" class="space-y-2 pl-3"></div>
        </div>
      </div>
    </section>

  </main>

<script>
const apiKey = "20cbd64e90926ce0eefd4b1e9127059d35058c253fb15a1a6b9b66efe131b5c0";

const urlParams = new URLSearchParams(window.location.search);
const matchId = urlParams.get('id'); 

async function loadMatchDetails() {
  if (!matchId) {
    document.body.innerHTML = `<div class="text-center p-20 text-gray-500">ID Pertandingan tidak ditemukan.</div>`;
    return;
  }

  try {
    const eventsResponse = await fetch(`https://apiv3.apifootball.com/?action=get_events&match_id=${matchId}&APIkey=${apiKey}`);
    const eventsData = await eventsResponse.json();
    const matchEvent = Array.isArray(eventsData) && eventsData.length > 0 ? eventsData[0] : null;
    
    if (matchEvent) {
      renderBaseAndEvents(matchEvent);

      const homeTeamId = matchEvent.match_hometeam_id;
      const awayTeamId = matchEvent.match_awayteam_id;

      // PARALEL REQUEST: Ditambahkan fetch statistik pertandingan
      const [lineupsResponse, h2hResponse, statsResponse] = await Promise.all([
        fetch(`https://apiv3.apifootball.com/?action=get_lineups&match_id=${matchId}&APIkey=${apiKey}`),
        fetch(`https://apiv3.apifootball.com/?action=get_H2H&firstTeamId=${homeTeamId}&secondTeamId=${awayTeamId}&APIkey=${apiKey}`),
        fetch(`https://apiv3.apifootball.com/?action=get_statistics&match_id=${matchId}&APIkey=${apiKey}`)
      ]);

      const lineupsData = await lineupsResponse.json();
      const h2hData = await h2hResponse.json();
      const statsData = await statsResponse.json();

      renderLineups(lineupsData, matchEvent);
      renderHeadToHead(h2hData, matchEvent);
      renderStatistics(statsData);
    } else {
      document.body.innerHTML = `<div class="text-center p-20 text-gray-500">Gagal memuat detail event pertandingan.</div>`;
    }
  } catch (e) {
    console.error("Error fetching match detail data:", e);
  }
}

function renderBaseAndEvents(match) {
  document.getElementById("scoreboard-loading").classList.add("hidden");
  document.getElementById("scoreboard-container").classList.remove("hidden");
  document.getElementById("scorers-summary").classList.remove("hidden");

  document.getElementById("league-name-header").innerText = match.league_name;
  document.getElementById("info-league").innerText = match.league_name;
  document.getElementById("info-stage").innerText = match.country_name || "International";
  document.getElementById("info-date").innerText = match.match_date;
  document.getElementById("info-time").innerText = `${match.match_time} WIB`;

  document.getElementById("home-name").innerText = match.match_hometeam_name;
  document.getElementById("away-name").innerText = match.match_awayteam_name;
  document.getElementById("home-logo").src = match.team_home_badge || "https://placehold.co/60";
  document.getElementById("away-logo").src = match.team_away_badge || "https://placehold.co/60";
  document.getElementById("match-score").innerText = `${match.match_hometeam_score} - ${match.match_awayteam_score}`;
  document.getElementById("match-status").innerText = match.match_status === "Finished" ? "Full-Time" : match.match_status;

  const timelineContainer = document.getElementById("timeline-container");
  timelineContainer.innerHTML = "";
  
  const homeScorers = [];
  const awayScorers = [];
  let allEvents = [];

  if (match.goalscorer && Array.isArray(match.goalscorer)) {
    match.goalscorer.forEach(g => {
      allEvents.push({ ...g, type: 'goal', minute: parseInt(g.time) || 0 });
      if (g.home_scorer) homeScorers.push(`${g.home_scorer} (${g.time}')`);
      if (g.away_scorer) awayScorers.push(`${g.away_scorer} (${g.time}')`);
    });
  }

  if (match.cards && Array.isArray(match.cards)) {
    match.cards.forEach(c => {
      allEvents.push({ ...c, type: 'card', minute: parseInt(c.time) || 0 });
    });
  }

  document.getElementById("home-scorers-list").innerHTML = homeScorers.map(s => `<div>${s}</div>`).join("");
  document.getElementById("away-scorers-list").innerHTML = awayScorers.map(s => `<div>${s}</div>`).join("");

  if (allEvents.length > 0) {
    allEvents.sort((a, b) => a.minute - b.minute);
    allEvents.forEach(ev => {
      const isHome = ev.home_fault || ev.home_scorer ? true : false;
      let eventIcon = "⚽";
      let eventDetail = "";

      if (ev.type === 'goal') {
        eventDetail = `<strong>Gol!</strong> ${ev.home_scorer || ev.away_scorer} ${ev.info ? `(${ev.info})` : ''}`;
      } else if (ev.type === 'card') {
        const isYellow = ev.card.toLowerCase().includes("yellow");
        eventIcon = isYellow ? "🟨" : "🟥";
        eventDetail = `Kartu ${isYellow ? 'Kuning' : 'Merah'}: ${ev.home_fault || ev.away_fault}`;
      }

      const itemHtml = `
        <div class="relative flex items-center justify-between ${isHome ? 'text-left' : 'flex-row-reverse text-right'}">
          <span class="absolute -left-[31px] bg-[#0b0c0d] border-2 border-gray-700 w-4 h-4 rounded-full z-10"></span>
          <div class="w-[85%]">
            <span class="text-xs font-bold text-gray-500 mr-2 bg-gray-900 px-1.5 py-0.5 rounded border border-gray-800">${ev.time}'</span>
            <span class="text-sm text-gray-300">${eventDetail}</span>
          </div>
          <span class="text-base w-[15%] text-center">${eventIcon}</span>
        </div>
      `;
      timelineContainer.insertAdjacentHTML("beforeend", itemHtml);
    });
  } else {
    timelineContainer.innerHTML = `<p class="text-xs text-gray-500 py-2">Tidak ada log kronologi kejadian pertandingan.</p>`;
  }
}

// LOGIKA RENDER STATISTIK BARU (MENYESUAIKAN RESPONSE API ASLI)
function renderStatistics(statsData) {
  const container = document.getElementById("stats-container");
  
  // Ambil object data tim berdasarkan ID Match key di API
  const matchIdKey = matchId.toString();
  const targetMatchStats = statsData[matchIdKey] || statsData;

  if (!targetMatchStats || !targetMatchStats.statistics || targetMatchStats.statistics.length === 0) {
    container.innerHTML = `
      <div class="bg-[#141414] text-center p-8 text-sm text-gray-500 rounded-xl border border-gray-900">
        Statistik pertandingan belum tersedia untuk laga ini.
      </div>
    `;
    return;
  }

  const rawStats = targetMatchStats.statistics;

  // Helper function buat nyari data statistik
  const getStat = (type) => rawStats.find(s => s.type.toLowerCase() === type.toLowerCase());

  // Bikin data buatan (sintetis) untuk "Total Tembakan" karena API tidak menyediakannya
  const onTarget = getStat("On Target");
  const offTarget = getStat("Off Target");
  if (onTarget && offTarget && !getStat("Total Shots")) {
    rawStats.push({
      type: "Total Shots",
      home: (parseInt(onTarget.home || 0) + parseInt(offTarget.home || 0)).toString(),
      away: (parseInt(onTarget.away || 0) + parseInt(offTarget.away || 0)).toString()
    });
  }

  // Definisikan kategori grup berdasarkan key aslinya dari API
  const groups = {
    "Statistik utama": ["Ball Possession", "Total Shots", "On Target", "Corners"],
    "Tembakan": ["Total Shots", "On Target", "Off Target"],
    "Serangan": ["Corners", "Free Kick", "Attacks", "Dangerous Attacks"],
    "Lainnya": ["Throw In", "Goal Kick", "Substitution", "Penalty"]
  };

  // Terjemahan label ke Bahasa Indonesia biar sesuai UI
  const translateLabel = {
    "Ball Possession": "Penguasaan bola",
    "Total Shots": "Total tembakan",
    "On Target": "Tembakan ke arah gawang",
    "Off Target": "Tembakan ke luar gawang",
    "Corners": "Tendangan Sudut",
    "Free Kick": "Tendangan Bebas",
    "Throw In": "Lemparan Ke Dalam",
    "Attacks": "Serangan",
    "Dangerous Attacks": "Serangan Berbahaya",
    "Goal Kick": "Tendangan Gawang",
    "Substitution": "Pergantian Pemain",
    "Penalty": "Penalti"
  };

  let finalHtml = "";

  // Loop setiap kelompok judul besar
  for (const groupTitle in groups) {
    const desiredTypes = groups[groupTitle];
    let itemsHtml = "";

    desiredTypes.forEach(type => {
      // Cari data berdasarkan mapping group
      const statObj = getStat(type);
      if (!statObj) return;

      const homeValStr = statObj.home || "0";
      const awayValStr = statObj.away || "0";

      // Bersihkan karakter persen (%) jika ada untuk perhitungan rumus lebar bar
      const homeVal = parseFloat(homeValStr.replace("%", "")) || 0;
      const awayVal = parseFloat(awayValStr.replace("%", "")) || 0;
      const total = homeVal + awayVal;

      // Hitung persentase lebar bar (Maksimal total 100%)
      let homeBarWidth = 0;
      let awayBarWidth = 0;
      if (total > 0) {
        homeBarWidth = (homeVal / total) * 100;
        awayBarWidth = (awayVal / total) * 100;
      } else {
        // Jika keduanya nol, biarkan kosong
        homeBarWidth = 0;
        awayBarWidth = 0;
      }

      const displayType = translateLabel[statObj.type] || statObj.type;

      // Render Bar Kiri (Merah) dan Bar Kanan (Putih)
      itemsHtml += `
        <div class="space-y-1.5">
          <div class="flex justify-between text-[13px] font-semibold text-gray-200 px-0.5">
            <span>${homeValStr}</span>
            <span class="text-xs text-gray-400 font-medium">${displayType}</span>
            <span>${awayValStr}</span>
          </div>
          <!-- Bar Track Wrapper -->
          <div class="flex w-full h-[5px] bg-gray-900 rounded-full overflow-hidden">
            <!-- Home Bar (Merah - Rata Kanan) -->
            <div class="w-1/2 flex justify-end bg-gray-900 pr-[1px]">
              <div class="h-full bg-red-600 rounded-l-full transition-all duration-500" style="width: ${homeBarWidth}%"></div>
            </div>
            <!-- Away Bar (Putih - Rata Kiri) -->
            <div class="w-1/2 flex justify-start bg-gray-900 pl-[1px]">
              <div class="h-full bg-white rounded-r-full transition-all duration-500" style="width: ${awayBarWidth}%"></div>
            </div>
          </div>
        </div>
      `;
    });

    if (itemsHtml !== "") {
      finalHtml += `
        <div class="space-y-3.5">
          <h3 class="text-sm font-bold text-gray-200 tracking-wide text-[14px] px-0.5">${groupTitle}</h3>
          <div class="bg-[#121315]/40 border border-gray-900/80 rounded-xl p-4.5 space-y-4">
            ${itemsHtml}
          </div>
        </div>
      `;
    }
  }

  container.innerHTML = finalHtml || `<div class="text-center p-6 text-gray-500">Statistik belum siap dimuat.</div>`;
}


function renderLineups(lineupsData, matchEvent) {
  const matchIdKey = matchId.toString();
  const matchContainer = lineupsData[matchIdKey] || lineupsData;
  const targetLineup = matchContainer && matchContainer.lineup ? matchContainer.lineup : null;

  if (targetLineup && targetLineup.home && targetLineup.away) {
    const homeCoach = targetLineup.home.coach?.[0]?.lineup_player || "Unknown";
    const awayCoach = targetLineup.away.coach?.[0]?.lineup_player || "Unknown";
    document.getElementById("home-coach").innerText = homeCoach;
    document.getElementById("away-coach").innerText = awayCoach;

    const homeStarterContainer = document.getElementById("home-starting-players");
    if (Array.isArray(targetLineup.home.starting_lineups)) {
      homeStarterContainer.innerHTML = targetLineup.home.starting_lineups.map(p => `
        <div class="flex items-center gap-2.5 py-1.5 border-b border-gray-900/20">
          <span class="w-5 shrink-0 text-center text-[11px] font-extrabold text-red-400 bg-red-950/50 border border-red-900/30 py-0.5 rounded">${p.lineup_number || '-'}</span>
          <span class="text-gray-300 font-medium text-[13px] truncate">${p.lineup_player}</span>
        </div>
      `).join("");
    }

    const awayStarterContainer = document.getElementById("away-starting-players");
    if (Array.isArray(targetLineup.away.starting_lineups)) {
      awayStarterContainer.innerHTML = targetLineup.away.starting_lineups.map(p => `
        <div class="flex items-center gap-2.5 py-1.5 border-b border-gray-900/20 flex-row-reverse text-right">
          <span class="w-5 shrink-0 text-center text-[11px] font-extrabold text-gray-300 bg-gray-800 border border-gray-700/50 py-0.5 rounded">${p.lineup_number || '-'}</span>
          <span class="text-gray-300 font-medium text-[13px] truncate">${p.lineup_player}</span>
        </div>
      `).join("");
    }

    const homeSubsContainer = document.getElementById("home-substitute-players");
    if (Array.isArray(targetLineup.home.substitutes) && targetLineup.home.substitutes.length > 0) {
      homeSubsContainer.innerHTML = targetLineup.home.substitutes.map(p => `
        <div class="flex items-center gap-2.5 py-1.5 border-b border-gray-900/20">
          <span class="w-5 shrink-0 text-center text-[11px] font-bold text-gray-400 bg-gray-900 px-1 rounded">${p.lineup_number || '-'}</span>
          <span class="text-gray-500 text-[13px] truncate">${p.lineup_player}</span>
        </div>
      `).join("");
    } else {
      homeSubsContainer.innerHTML = `<p class="text-xs text-gray-600 py-1">Tidak ada pemain cadangan.</p>`;
    }

    const awaySubsContainer = document.getElementById("away-substitute-players");
    if (Array.isArray(targetLineup.away.substitutes) && targetLineup.away.substitutes.length > 0) {
      awaySubsContainer.innerHTML = targetLineup.away.substitutes.map(p => `
        <div class="flex items-center gap-2.5 py-1.5 border-b border-gray-900/20 flex-row-reverse text-right">
          <span class="w-5 shrink-0 text-center text-[11px] font-bold text-gray-400 bg-gray-900 px-1 rounded">${p.lineup_number || '-'}</span>
          <span class="text-gray-500 text-[13px] truncate">${p.lineup_player}</span>
        </div>
      `).join("");
    } else {
      awaySubsContainer.innerHTML = `<p class="text-xs text-gray-600 py-1 text-right">Tidak ada pemain cadangan.</p>`;
    }
  } else {
    document.getElementById("tab-lineup").innerHTML = `
      <div class="bg-[#141414] text-center p-8 text-sm text-gray-500 rounded-xl border border-gray-900">
        Line-up susunan pemain belum tersedia untuk laga ini.
      </div>
    `;
  }
}

function renderHeadToHead(h2hData, matchEvent) {
  const h2hContainer = document.getElementById("h2h-container");
  const h2hMatches = h2hData && Array.isArray(h2hData.firstTeam_VS_secondTeam) ? h2hData.firstTeam_VS_secondTeam : [];

  if (h2hMatches.length === 0) {
    h2hContainer.innerHTML = `
      <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider text-[11px] px-1 mt-2">Head to Heads</h3>
      <div class="bg-[#141414] border border-gray-900 rounded-xl p-6 text-center flex flex-col justify-center items-center min-h-[120px]">
        <h4 class="text-[14px] font-bold text-white tracking-wide">First Encounter Ahead!</h4>
        <p class="text-[12px] text-gray-500 mt-1">These teams haven't faced each other yet.</p>
        <div class="flex justify-center gap-1.5 mt-4">
          <span class="w-1.5 h-1.5 bg-red-600 rounded-full"></span>
          <span class="w-1.5 h-1.5 bg-gray-700 rounded-full"></span>
          <span class="w-1.5 h-1.5 bg-gray-700 rounded-full"></span>
        </div>
      </div>
    `;
    return;
  }

  let homeWins = 0;
  let awayWins = 0;
  let draws = 0;

  h2hMatches.forEach(m => {
    const hScore = parseInt(m.match_hometeam_score);
    const aScore = parseInt(m.match_awayteam_score);
    if (hScore === aScore) {
      draws++;
    } else {
      const winnerName = hScore > aScore ? m.match_hometeam_name : m.match_awayteam_name;
      if (winnerName === matchEvent.match_hometeam_name) {
        homeWins++;
      } else {
        awayWins++;
      }
    }
  });

  let h2hHtml = `
    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider text-[11px] px-1 mt-2">Head to Heads</h3>
    <div class="bg-[#141414] border border-gray-900 rounded-xl p-4 space-y-4">
      <div class="grid grid-cols-3 text-center border-b border-gray-900/60 pb-3.5">
        <div>
          <div class="text-[13px] font-bold text-white">${homeWins} Wins</div>
          <div class="w-10 h-[3px] bg-red-600 rounded-full mx-auto mt-1.5"></div>
        </div>
        <div>
          <div class="text-[13px] font-bold text-white">${draws} Draws</div>
          <div class="w-10 h-[3px] bg-gray-500 rounded-full mx-auto mt-1.5"></div>
        </div>
        <div>
          <div class="text-[13px] font-bold text-white">${awayWins} Wins</div>
          <div class="w-10 h-[3px] bg-white rounded-full mx-auto mt-1.5"></div>
        </div>
      </div>
      <div class="space-y-4" id="h2h-grouped-list"></div>
    </div>
  `;

  h2hContainer.innerHTML = h2hHtml;
  const listTarget = document.getElementById("h2h-grouped-list");

  const leagueGroups = {};
  h2hMatches.forEach(m => {
    if (!leagueGroups[m.league_name]) leagueGroups[m.league_name] = [];
    leagueGroups[m.league_name].push(m);
  });

  for (const leagueName in leagueGroups) {
    const matchesInLeague = leagueGroups[leagueName];
    const yearGroups = {};
    matchesInLeague.forEach(m => {
      const year = m.match_date ? m.match_date.split("-")[0] : "N/A";
      if (!yearGroups[year]) yearGroups[year] = [];
      yearGroups[year].push(m);
    });

    let leagueMatchesBody = "";
    for (const year in yearGroups) {
      const currentYearMatches = yearGroups[year];
      leagueMatchesBody += `
        <div class="flex items-start gap-3 py-2 border-b border-gray-900/30 last:border-0">
          <div class="text-[11px] font-bold text-gray-500 shrink-0 min-w-[36px] pt-1">${year}</div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 w-full">
            ${currentYearMatches.map(m => {
              const dateRaw = new Date(m.match_date);
              const formattedDate = !isNaN(dateRaw) ? dateRaw.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }) : m.match_date;
              return `
                <div class="flex items-center justify-between bg-black/40 border border-gray-900/60 rounded-lg px-2.5 py-1.5 text-[12px]">
                  <span class="text-gray-500 font-medium">${formattedDate}</span>
                  <div class="flex items-center gap-2 mx-auto">
                    <span class="font-bold text-gray-300 max-w-[75px] truncate">${m.match_hometeam_name}</span>
                    <span class="bg-black text-[11px] font-extrabold text-white px-2 py-0.5 rounded border border-gray-800 tracking-wide">
                      ${m.match_hometeam_score} - ${m.match_awayteam_score}
                    </span>
                    <span class="font-bold text-gray-300 max-w-[75px] truncate">${m.match_awayteam_name}</span>
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        </div>
      `;
    }

    const sectionBlock = document.createElement("div");
    sectionBlock.className = "space-y-1.5";
    sectionBlock.innerHTML = `
      <div class="text-[11px] font-bold text-gray-400 flex items-center gap-1 px-1">
        <span class="text-[12px]">⚽</span> ${leagueName}
      </div>
      <div class="bg-black/20 border border-gray-900/60 rounded-xl p-3">
        ${leagueMatchesBody}
      </div>
    `;
    listTarget.appendChild(sectionBlock);
  }
}

function switchTab(tabName) {
  document.querySelectorAll(".tab-content").forEach(el => el.classList.add("hidden"));
  document.getElementById(`tab-${tabName}`).classList.remove("hidden");

  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.classList.remove("bg-yellow-400", "text-black");
    btn.classList.add("bg-[#1c1d20]", "text-gray-400");
  });

  const activeBtn = document.getElementById(`btn-${tabName}`);
  activeBtn.classList.remove("bg-[#1c1d20]", "text-gray-400");
  activeBtn.classList.add("bg-yellow-400", "text-black");
}

loadMatchDetails();
</script>

</body>
</html>
