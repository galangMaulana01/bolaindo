<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }
  </style>
</head>

<body class="bg-gray-50 text-gray-800 min-h-screen pb-10">

  <header class="bg-[url('/benner.png')] aspect-[430/120] pt-6 pb-6">
    <div class="max-w-3xl mx-auto px-4">
      
      <div class="flex items-center justify-between mb-4">
        <button onclick="window.history.back()" class="p-2 hover:bg-white/10 rounded-full transition active:scale-95">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path>
          </svg>
        </button>
        <span class="text-xs font-bold tracking-wider text-white/80 uppercase" id="league-name-header">Match Detail</span>
        <div class="w-10"></div>
      </div>

      <div id="scoreboard-loading" class="text-center py-6 text-sm text-white/60 animate-pulse">Memuat data pertandingan...</div>
      
      <div id="scoreboard-container" class="hidden flex items-center justify-between px-4 py-4">
        <div class="flex flex-col items-center text-center w-[35%]">
          <div class="bg-white p-2 rounded-full mb-2 shadow-sm">
            <img id="home-logo" src="" class="w-14 h-14 object-contain" alt="">
          </div>
          <span id="home-name" class="text-[14px] font-bold text-white line-clamp-2 leading-tight"></span>
        </div>

        <div class="text-center w-[30%]">
          <div id="match-score" class="text-4xl font-black tracking-widest text-white drop-shadow-md">0 - 0</div>
          <div id="match-status" class="text-[10px] font-bold text-white bg-white/20 px-3 py-1 rounded-full border border-white/30 inline-block mt-2 tracking-wide uppercase">Full-Time</div>
        </div>

        <div class="flex flex-col items-center text-center w-[35%]">
          <div class="bg-white p-2 rounded-full mb-2 shadow-sm">
            <img id="away-logo" src="" class="w-14 h-14 object-contain" alt="">
          </div>
          <span id="away-name" class="text-[14px] font-bold text-white line-clamp-2 leading-tight"></span>
        </div>
      </div>

      <div id="scorers-summary" class="hidden grid grid-cols-2 gap-4 mt-4 px-2 text-[12px] text-white/80 border-t border-white/10 pt-3">
        <div id="home-scorers-list" class="space-y-1 text-left font-medium"></div>
        <div id="away-scorers-list" class="space-y-1 text-right font-medium"></div>
      </div>

    </div>
  </header>

  <nav class="sticky top-0 bg-white/95 backdrop-blur-md border-b border-gray-200 z-50 shadow-sm mt-[-20px] pt-5">
    <div class="max-w-2xl mx-auto px-4 py-3 flex gap-2 overflow-x-auto no-scrollbar">
      <button onclick="switchTab('overview')" id="btn-overview" class="tab-btn shrink-0 px-5 py-2 rounded-full text-xs font-bold bg-[#1C1D5F] text-white transition-all">Overview</button>
      <button onclick="switchTab('events')" id="btn-events" class="tab-btn shrink-0 px-5 py-2 rounded-full text-xs font-bold bg-gray-100 text-gray-500 hover:bg-gray-200 transition-all">Events</button>
      <button onclick="switchTab('stats')" id="btn-stats" class="tab-btn shrink-0 px-5 py-2 rounded-full text-xs font-bold bg-gray-100 text-gray-500 hover:bg-gray-200 transition-all">Stats</button>
      <button onclick="switchTab('lineup')" id="btn-lineup" class="tab-btn shrink-0 px-5 py-2 rounded-full text-xs font-bold bg-gray-100 text-gray-500 hover:bg-gray-200 transition-all">Line-up</button>
    </div>
  </nav>

  <main class="max-w-2xl mx-auto p-4 space-y-4">

    <section id="tab-overview" class="tab-content space-y-4">
      <div class="bg-white border border-gray-200 shadow-sm rounded-xl p-4">
        <h3 class="text-sm font-bold text-[#1C1D5F] mb-3 uppercase tracking-wider text-[11px]">Match Info</h3>
        <div class="space-y-3 text-sm">
          <div class="flex items-center gap-3 text-gray-600">
            <span class="text-base shrink-0 bg-gray-50 p-1.5 rounded-lg border border-gray-100">🏆</span>
            <div>
              <p id="info-league" class="font-bold text-gray-900"></p>
              <p id="info-stage" class="text-xs text-gray-500"></p>
            </div>
          </div>
          <div class="flex items-center gap-3 text-gray-600 border-t border-gray-100 pt-3">
            <span class="text-base shrink-0 bg-gray-50 p-1.5 rounded-lg border border-gray-100">📅</span>
            <div>
              <p id="info-date" class="font-bold text-gray-900"></p>
              <p id="info-time" class="text-xs text-gray-500"></p>
            </div>
          </div>
        </div>
      </div>

      <div id="h2h-container" class="space-y-3">
        <div class="bg-white border border-gray-200 shadow-sm rounded-xl p-4 text-center text-xs text-gray-400 animate-pulse">
          Memuat data Head-to-Head...
        </div>
      </div>
    </section>

    <section id="tab-events" class="tab-content hidden space-y-4">
      <div class="bg-white border border-gray-200 shadow-sm rounded-xl p-4">
        <h3 class="text-sm font-bold text-[#1C1D5F] mb-4 uppercase tracking-wider text-[11px]">Match Timeline</h3>
        <div class="relative border-l-2 border-gray-200 ml-4 pl-6 space-y-6" id="timeline-container"></div>
      </div>
    </section>

    <section id="tab-stats" class="tab-content hidden space-y-5">
      <div id="stats-container" class="space-y-6">
        <div class="bg-white border border-gray-200 shadow-sm rounded-xl p-6 text-center text-xs text-gray-400 animate-pulse">
          Memuat data statistik pertandingan...
        </div>
      </div>
    </section>

    <section id="tab-lineup" class="tab-content hidden space-y-4">
      <div class="bg-white border border-gray-200 shadow-sm rounded-xl p-4">
        <h4 class="text-[11px] font-bold text-[#1C1D5F] uppercase tracking-wider mb-3">Pelatih Utama</h4>
        <div class="grid grid-cols-2 gap-x-6 gap-y-2 text-sm">
          <div id="home-coach" class="space-y-2 border-r border-gray-200 pr-3 font-medium text-gray-800"></div>
          <div id="away-coach" class="space-y-2 pl-3 font-medium text-gray-800 text-right"></div>
        </div>
      </div>

      <div class="bg-white border border-gray-200 shadow-sm rounded-xl p-4">
        <h3 class="text-[11px] font-bold text-[#1C1D5F] uppercase tracking-wider mb-3">Starting Lineups</h3>
        <div class="grid grid-cols-2 gap-x-6 gap-y-2 text-sm">
          <div id="home-starting-players" class="space-y-2 border-r border-gray-200 pr-3"></div>
          <div id="away-starting-players" class="space-y-2 pl-3"></div>
        </div>
      </div>

      <div class="bg-white border border-gray-200 shadow-sm rounded-xl p-4">
        <h3 class="text-[11px] font-bold text-[#1C1D5F] uppercase tracking-wider mb-3">Substitutes (Cadangan)</h3>
        <div class="grid grid-cols-2 gap-x-6 gap-y-2 text-sm">
          <div id="home-substitute-players" class="space-y-2 border-r border-gray-200 pr-3"></div>
          <div id="away-substitute-players" class="space-y-2 pl-3"></div>
        </div>
      </div>
    </section>

  </main>

<script>
const apiKey = "20cbd64e90926ce0eefd4b1e9127059d35058c253fb15a1a6b9b66efe131b5c0";
const urlParams = new URLSearchParams(window.location.search);
const matchId = urlParams.get('id'); 

async function loadMatchDetails() {
  if (!matchId) {
    document.body.innerHTML = `<div class="text-center p-20 text-gray-500 font-medium">ID Pertandingan tidak ditemukan.</div>`;
    return;
  }

  try {
    const eventsResponse = await fetch(`https://apiv3.apifootball.com/?action=get_events&match_id=${matchId}&APIkey=${apiKey}`);
    const eventsData = await eventsResponse.json();
    const matchEvent = Array.isArray(eventsData) && eventsData.length > 0 ? eventsData[0] : null;
    
    if (matchEvent) {
      renderBaseAndEvents(matchEvent);

      const homeTeamId = matchEvent.match_hometeam_id;
      const awayTeamId = matchEvent.match_awayteam_id;

      const [lineupsResponse, h2hResponse, statsResponse] = await Promise.all([
        fetch(`https://apiv3.apifootball.com/?action=get_lineups&match_id=${matchId}&APIkey=${apiKey}`),
        fetch(`https://apiv3.apifootball.com/?action=get_H2H&firstTeamId=${homeTeamId}&secondTeamId=${awayTeamId}&APIkey=${apiKey}`),
        fetch(`https://apiv3.apifootball.com/?action=get_statistics&match_id=${matchId}&APIkey=${apiKey}`)
      ]);

      const lineupsData = await lineupsResponse.json();
      const h2hData = await h2hResponse.json();
      const statsData = await statsResponse.json();

      renderLineups(lineupsData, matchEvent);
      renderHeadToHead(h2hData, matchEvent);
      renderStatistics(statsData);
    } else {
      document.body.innerHTML = `<div class="text-center p-20 text-gray-500 font-medium">Gagal memuat detail event pertandingan.</div>`;
    }
  } catch (e) {
    console.error("Error fetching match detail data:", e);
  }
}

function renderBaseAndEvents(match) {
  document.getElementById("scoreboard-loading").classList.add("hidden");
  document.getElementById("scoreboard-container").classList.remove("hidden");
  document.getElementById("scorers-summary").classList.remove("hidden");

  document.getElementById("league-name-header").innerText = match.league_name;
  document.getElementById("info-league").innerText = match.league_name;
  document.getElementById("info-stage").innerText = match.country_name || "International";
  document.getElementById("info-date").innerText = match.match_date;
  document.getElementById("info-time").innerText = `${match.match_time} WIB`;

  document.getElementById("home-name").innerText = match.match_hometeam_name;
  document.getElementById("away-name").innerText = match.match_awayteam_name;
  document.getElementById("home-logo").src = match.team_home_badge || "https://placehold.co/60";
  document.getElementById("away-logo").src = match.team_away_badge || "https://placehold.co/60";
  document.getElementById("match-score").innerText = `${match.match_hometeam_score} - ${match.match_awayteam_score}`;
  document.getElementById("match-status").innerText = match.match_status === "Finished" ? "Full-Time" : match.match_status;

  const timelineContainer = document.getElementById("timeline-container");
  timelineContainer.innerHTML = "";
  
  const homeScorers = [];
  const awayScorers = [];
  let allEvents = [];

  if (match.goalscorer && Array.isArray(match.goalscorer)) {
    match.goalscorer.forEach(g => {
      allEvents.push({ ...g, type: 'goal', minute: parseInt(g.time) || 0 });
      if (g.home_scorer) homeScorers.push(`${g.home_scorer} <span class="text-[10px] text-white/50 ml-1">(${g.time}')</span>`);
      if (g.away_scorer) awayScorers.push(`<span class="text-[10px] text-white/50 mr-1">(${g.time}')</span> ${g.away_scorer}`);
    });
  }

  if (match.cards && Array.isArray(match.cards)) {
    match.cards.forEach(c => {
      allEvents.push({ ...c, type: 'card', minute: parseInt(c.time) || 0 });
    });
  }

  document.getElementById("home-scorers-list").innerHTML = homeScorers.map(s => `<div>${s}</div>`).join("");
  document.getElementById("away-scorers-list").innerHTML = awayScorers.map(s => `<div>${s}</div>`).join("");

  if (allEvents.length > 0) {
    allEvents.sort((a, b) => a.minute - b.minute);
    allEvents.forEach(ev => {
      const isHome = ev.home_fault || ev.home_scorer ? true : false;
      let eventIcon = "⚽";
      let eventDetail = "";

      if (ev.type === 'goal') {
        eventDetail = `<strong class="text-gray-900">Gol!</strong> ${ev.home_scorer || ev.away_scorer} <span class="text-gray-500">${ev.info ? `(${ev.info})` : ''}</span>`;
      } else if (ev.type === 'card') {
        const isYellow = ev.card.toLowerCase().includes("yellow");
        eventIcon = isYellow ? "🟨" : "🟥";
        eventDetail = `Kartu ${isYellow ? 'Kuning' : 'Merah'}: ${ev.home_fault || ev.away_fault}`;
      }

      const itemHtml = `
        <div class="relative flex items-center justify-between ${isHome ? 'text-left' : 'flex-row-reverse text-right'} py-1">
          <span class="absolute -left-[31px] bg-white border-2 border-gray-300 w-4 h-4 rounded-full z-10"></span>
          <div class="w-[85%] flex items-center ${isHome ? 'flex-row' : 'flex-row-reverse'} gap-2">
            <span class="text-[11px] font-bold text-[#1C1D5F] bg-[#1C1D5F]/10 px-1.5 py-0.5 rounded border border-[#1C1D5F]/20 shadow-sm">${ev.time}'</span>
            <span class="text-sm text-gray-700">${eventDetail}</span>
          </div>
          <div class="w-[15%] flex justify-center">
            <span class="text-xl">${eventIcon}</span>
          </div>
        </div>
      `;
      timelineContainer.insertAdjacentHTML("beforeend", itemHtml);
    });
  } else {
    timelineContainer.innerHTML = `<p class="text-xs text-gray-400 py-2">Tidak ada log kronologi kejadian pertandingan.</p>`;
  }
}

function renderStatistics(statsData) {
  const container = document.getElementById("stats-container");
  const matchIdKey = matchId.toString();
  const targetMatchStats = statsData[matchIdKey] || statsData;

  if (!targetMatchStats || !targetMatchStats.statistics || targetMatchStats.statistics.length === 0) {
    container.innerHTML = `
      <div class="bg-gray-50 text-center p-8 text-sm text-gray-500 rounded-xl border border-gray-200">
        Statistik pertandingan belum tersedia untuk laga ini.
      </div>
    `;
    return;
  }

  const rawStats = targetMatchStats.statistics;
  const getStat = (type) => rawStats.find(s => s.type.toLowerCase() === type.toLowerCase());

  const onTarget = getStat("On Target");
  const offTarget = getStat("Off Target");
  if (onTarget && offTarget && !getStat("Total Shots")) {
    rawStats.push({
      type: "Total Shots",
      home: (parseInt(onTarget.home || 0) + parseInt(offTarget.home || 0)).toString(),
      away: (parseInt(onTarget.away || 0) + parseInt(offTarget.away || 0)).toString()
    });
  }

  const groups = {
    "Statistik Utama": ["Ball Possession", "Total Shots", "On Target", "Corners"],
    "Tembakan": ["Total Shots", "On Target", "Off Target"],
    "Serangan": ["Corners", "Free Kick", "Attacks", "Dangerous Attacks"],
    "Lainnya": ["Throw In", "Goal Kick", "Substitution", "Penalty"]
  };

  const translateLabel = {
    "Ball Possession": "Penguasaan bola",
    "Total Shots": "Total tembakan",
    "On Target": "Tembakan ke arah gawang",
    "Off Target": "Tembakan ke luar gawang",
    "Corners": "Tendangan Sudut",
    "Free Kick": "Tendangan Bebas",
    "Throw In": "Lemparan Ke Dalam",
    "Attacks": "Serangan",
    "Dangerous Attacks": "Serangan Berbahaya",
    "Goal Kick": "Tendangan Gawang",
    "Substitution": "Pergantian Pemain",
    "Penalty": "Penalti"
  };

  let finalHtml = "";

  for (const groupTitle in groups) {
    const desiredTypes = groups[groupTitle];
    let itemsHtml = "";

    desiredTypes.forEach(type => {
      const statObj = getStat(type);
      if (!statObj) return;

      const homeValStr = statObj.home || "0";
      const awayValStr = statObj.away || "0";

      const homeVal = parseFloat(homeValStr.replace("%", "")) || 0;
      const awayVal = parseFloat(awayValStr.replace("%", "")) || 0;
      const total = homeVal + awayVal;

      let homeBarWidth = 0;
      let awayBarWidth = 0;
      if (total > 0) {
        homeBarWidth = (homeVal / total) * 100;
        awayBarWidth = (awayVal / total) * 100;
      }

      const displayType = translateLabel[statObj.type] || statObj.type;

      itemsHtml += `
        <div class="space-y-1.5">
          <div class="flex justify-between text-[13px] font-bold text-gray-800 px-0.5">
            <span>${homeValStr}</span>
            <span class="text-xs text-gray-500 font-semibold">${displayType}</span>
            <span>${awayValStr}</span>
          </div>
          <div class="flex w-full h-[6px] bg-gray-200 rounded-full overflow-hidden">
            <div class="w-1/2 flex justify-end bg-gray-200 pr-[1px]">
              <div class="h-full bg-[#1C1D5F] rounded-l-full transition-all duration-500" style="width: ${homeBarWidth}%"></div>
            </div>
            <div class="w-1/2 flex justify-start bg-gray-200 pl-[1px]">
              <div class="h-full bg-red-500 rounded-r-full transition-all duration-500" style="width: ${awayBarWidth}%"></div>
            </div>
          </div>
        </div>
      `;
    });

    if (itemsHtml !== "") {
      finalHtml += `
        <div class="space-y-3.5">
          <h3 class="text-[11px] font-bold text-[#1C1D5F] tracking-wider uppercase px-0.5">${groupTitle}</h3>
          <div class="bg-white border border-gray-200 shadow-sm rounded-xl p-4.5 space-y-4">
            ${itemsHtml}
          </div>
        </div>
      `;
    }
  }

  container.innerHTML = finalHtml || `<div class="text-center p-6 text-gray-400">Statistik belum siap dimuat.</div>`;
}

function renderLineups(lineupsData, matchEvent) {
  const matchIdKey = matchId.toString();
  const matchContainer = lineupsData[matchIdKey] || lineupsData;
  const targetLineup = matchContainer && matchContainer.lineup ? matchContainer.lineup : null;

  if (targetLineup && targetLineup.home && targetLineup.away) {
    const homeCoach = targetLineup.home.coach?.[0]?.lineup_player || "Unknown";
    const awayCoach = targetLineup.away.coach?.[0]?.lineup_player || "Unknown";
    document.getElementById("home-coach").innerText = homeCoach;
    document.getElementById("away-coach").innerText = awayCoach;

    const homeStarterContainer = document.getElementById("home-starting-players");
    if (Array.isArray(targetLineup.home.starting_lineups)) {
      homeStarterContainer.innerHTML = targetLineup.home.starting_lineups.map(p => `
        <div class="flex items-center gap-2.5 py-2 border-b border-gray-100 last:border-0">
          <span class="w-6 shrink-0 text-center text-[10px] font-extrabold text-[#1C1D5F] bg-[#1C1D5F]/10 border border-[#1C1D5F]/20 py-0.5 rounded shadow-sm">${p.lineup_number || '-'}</span>
          <span class="text-gray-800 font-semibold text-[13px] truncate">${p.lineup_player}</span>
        </div>
      `).join("");
    }

    const awayStarterContainer = document.getElementById("away-starting-players");
    if (Array.isArray(targetLineup.away.starting_lineups)) {
      awayStarterContainer.innerHTML = targetLineup.away.starting_lineups.map(p => `
        <div class="flex items-center gap-2.5 py-2 border-b border-gray-100 last:border-0 flex-row-reverse text-right">
          <span class="w-6 shrink-0 text-center text-[10px] font-extrabold text-red-600 bg-red-50 border border-red-200 py-0.5 rounded shadow-sm">${p.lineup_number || '-'}</span>
          <span class="text-gray-800 font-semibold text-[13px] truncate">${p.lineup_player}</span>
        </div>
      `).join("");
    }

    const homeSubsContainer = document.getElementById("home-substitute-players");
    if (Array.isArray(targetLineup.home.substitutes) && targetLineup.home.substitutes.length > 0) {
      homeSubsContainer.innerHTML = targetLineup.home.substitutes.map(p => `
        <div class="flex items-center gap-2.5 py-2 border-b border-gray-100 last:border-0">
          <span class="w-5 shrink-0 text-center text-[10px] font-bold text-gray-500 bg-gray-100 px-1 rounded border border-gray-200">${p.lineup_number || '-'}</span>
          <span class="text-gray-600 text-[13px] font-medium truncate">${p.lineup_player}</span>
        </div>
      `).join("");
    } else {
      homeSubsContainer.innerHTML = `<p class="text-xs text-gray-400 py-2">Tidak ada pemain cadangan.</p>`;
    }

    const awaySubsContainer = document.getElementById("away-substitute-players");
    if (Array.isArray(targetLineup.away.substitutes) && targetLineup.away.substitutes.length > 0) {
      awaySubsContainer.innerHTML = targetLineup.away.substitutes.map(p => `
        <div class="flex items-center gap-2.5 py-2 border-b border-gray-100 last:border-0 flex-row-reverse text-right">
          <span class="w-5 shrink-0 text-center text-[10px] font-bold text-gray-500 bg-gray-100 px-1 rounded border border-gray-200">${p.lineup_number || '-'}</span>
          <span class="text-gray-600 text-[13px] font-medium truncate">${p.lineup_player}</span>
        </div>
      `).join("");
    } else {
      awaySubsContainer.innerHTML = `<p class="text-xs text-gray-400 py-2 text-right">Tidak ada pemain cadangan.</p>`;
    }
  } else {
    document.getElementById("tab-lineup").innerHTML = `
      <div class="bg-gray-50 text-center p-8 text-sm text-gray-500 rounded-xl border border-gray-200">
        Line-up susunan pemain belum tersedia untuk laga ini.
      </div>
    `;
  }
}

function renderHeadToHead(h2hData, matchEvent) {
  const h2hContainer = document.getElementById("h2h-container");
  const h2hMatches = h2hData && Array.isArray(h2hData.firstTeam_VS_secondTeam) ? h2hData.firstTeam_VS_secondTeam : [];

  if (h2hMatches.length === 0) {
    h2hContainer.innerHTML = `
      <h3 class="text-[11px] font-bold text-[#1C1D5F] uppercase tracking-wider px-1 mt-4 mb-2">Head to Heads</h3>
      <div class="bg-white border border-gray-200 shadow-sm rounded-xl p-6 text-center flex flex-col justify-center items-center min-h-[120px]">
        <h4 class="text-[14px] font-bold text-gray-800 tracking-wide">First Encounter Ahead!</h4>
        <p class="text-[12px] text-gray-500 mt-1">These teams haven't faced each other yet.</p>
        <div class="flex justify-center gap-1.5 mt-4">
          <span class="w-1.5 h-1.5 bg-[#1C1D5F] rounded-full"></span>
          <span class="w-1.5 h-1.5 bg-gray-300 rounded-full"></span>
          <span class="w-1.5 h-1.5 bg-red-500 rounded-full"></span>
        </div>
      </div>
    `;
    return;
  }

  let homeWins = 0;
  let awayWins = 0;
  let draws = 0;

  h2hMatches.forEach(m => {
    const hScore = parseInt(m.match_hometeam_score);
    const aScore = parseInt(m.match_awayteam_score);
    if (hScore === aScore) {
      draws++;
    } else {
      const winnerName = hScore > aScore ? m.match_hometeam_name : m.match_awayteam_name;
      if (winnerName === matchEvent.match_hometeam_name) {
        homeWins++;
      } else {
        awayWins++;
      }
    }
  });

  let h2hHtml = `
    <h3 class="text-[11px] font-bold text-[#1C1D5F] uppercase tracking-wider px-1 mt-4 mb-2">Head to Heads</h3>
    <div class="bg-white border border-gray-200 shadow-sm rounded-xl p-4 space-y-4">
      <div class="grid grid-cols-3 text-center border-b border-gray-100 pb-3.5">
        <div>
          <div class="text-[13px] font-bold text-gray-800">${homeWins} Wins</div>
          <div class="w-10 h-[4px] bg-[#1C1D5F] rounded-full mx-auto mt-1.5"></div>
        </div>
        <div>
          <div class="text-[13px] font-bold text-gray-800">${draws} Draws</div>
          <div class="w-10 h-[4px] bg-gray-300 rounded-full mx-auto mt-1.5"></div>
        </div>
        <div>
          <div class="text-[13px] font-bold text-gray-800">${awayWins} Wins</div>
          <div class="w-10 h-[4px] bg-red-500 rounded-full mx-auto mt-1.5"></div>
        </div>
      </div>
      <div class="space-y-4" id="h2h-grouped-list"></div>
    </div>
  `;

  h2hContainer.innerHTML = h2hHtml;
  const listTarget = document.getElementById("h2h-grouped-list");

  const leagueGroups = {};
  h2hMatches.forEach(m => {
    if (!leagueGroups[m.league_name]) leagueGroups[m.league_name] = [];
    leagueGroups[m.league_name].push(m);
  });

  for (const leagueName in leagueGroups) {
    const matchesInLeague = leagueGroups[leagueName];
    const yearGroups = {};
    matchesInLeague.forEach(m => {
      const year = m.match_date ? m.match_date.split("-")[0] : "N/A";
      if (!yearGroups[year]) yearGroups[year] = [];
      yearGroups[year].push(m);
    });

    let leagueMatchesBody = "";
    for (const year in yearGroups) {
      const currentYearMatches = yearGroups[year];
      leagueMatchesBody += `
        <div class="flex items-start gap-3 py-2 border-b border-gray-200 last:border-0">
          <div class="text-[11px] font-bold text-gray-400 shrink-0 min-w-[36px] pt-1">${year}</div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 w-full">
            ${currentYearMatches.map(m => {
              const dateRaw = new Date(m.match_date);
              const formattedDate = !isNaN(dateRaw) ? dateRaw.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }) : m.match_date;
              return `
                <div class="flex items-center justify-between bg-gray-50 border border-gray-200 rounded-lg px-2.5 py-1.5 text-[12px] hover:bg-gray-100 transition-colors">
                  <span class="text-gray-500 font-medium">${formattedDate}</span>
                  <div class="flex items-center gap-2 mx-auto">
                    <span class="font-bold text-gray-800 max-w-[75px] truncate">${m.match_hometeam_name}</span>
                    <span class="bg-white text-[11px] font-black text-[#1C1D5F] px-2 py-0.5 rounded border border-gray-200 tracking-wide shadow-sm">
                      ${m.match_hometeam_score} - ${m.match_awayteam_score}
                    </span>
                    <span class="font-bold text-gray-800 max-w-[75px] truncate">${m.match_awayteam_name}</span>
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        </div>
      `;
    }

    const sectionBlock = document.createElement("div");
    sectionBlock.className = "space-y-1.5 mt-2";
    sectionBlock.innerHTML = `
      <div class="text-[11px] font-bold text-gray-500 flex items-center gap-1 px-1 uppercase tracking-wide">
        <span class="text-[12px]">⚽</span> ${leagueName}
      </div>
      <div class="bg-white border border-gray-200 shadow-sm rounded-xl p-3">
        ${leagueMatchesBody}
      </div>
    `;
    listTarget.appendChild(sectionBlock);
  }
}

function switchTab(tabName) {
  document.querySelectorAll(".tab-content").forEach(el => el.classList.add("hidden"));
  document.getElementById(`tab-${tabName}`).classList.remove("hidden");

  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.classList.remove("bg-[#1C1D5F]", "text-white");
    btn.classList.add("bg-gray-100", "text-gray-500");
  });

  const activeBtn = document.getElementById(`btn-${tabName}`);
  activeBtn.classList.remove("bg-gray-100", "text-gray-500");
  activeBtn.classList.add("bg-[#1C1D5F]", "text-white");
}

loadMatchDetails();
</script>
